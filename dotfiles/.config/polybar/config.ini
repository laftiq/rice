[colors]
background = #242424
background-alt = #454545
foreground = #D0D0D0
primary = #B8B8B8
secondary = #777777
alert = #B77B7B
disabled = #777777

[bar/example]
width = 100%
height = 24pt
radius = 0

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 0pt

border-size = 0pt
border-color = #00000000

padding-left = 2
padding-right = 2

module-margin = 0

separator = " "
separator-foreground = ${colors.disabled}

font-0 = "DejaVu Sans Mono:style=Bold:pixelsize=11:antialias=true:hinting=true;2"
font-1 = "Noto Sans Symbols 2:pixelsize=13;2"
font-2 = "DejaVu Sans:style=Book:pixelsize=11;2"
font-3 = "Noto Sans Symbols 2:pixelsize=13;4"
font-4 = "Panel Network Icons:pixelsize=14;5"

modules-left = logo divider appicon xwindow
modules-center = music
modules-right = internet right-divider happ right-divider filesystem right-divider pulseaudio right-divider memory right-divider date right-divider notifications right-divider powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces
enable-scroll = true
reverse-scroll = true
icon-default = ·

label-active = ●
label-active-background = ${colors.background}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = ·
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %icon%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
format-margin-left = 0
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

format-mounted = %{A1:python3 __RICE_HOME__/.config/polybar/scripts/disks-menu.py:}<label-mounted>%{A}
label-mounted = %percentage_used%%{T3}%%{T-}

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = custom/script
exec = python3 __RICE_HOME__/.config/polybar/scripts/audio-volume.py
tail = true
format = <label>
label = %output%
click-left = python3 __RICE_HOME__/.config/polybar/scripts/audio-output.py
click-right = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format = %{A1:python3 __RICE_HOME__/.config/polybar/scripts/memory-menu.py:}<label>%{A}
label = RAM %percentage_used:2%%{T3}%%{T-}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%{T3}%%{T-}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#B8B8B8}%ifname%%{F#777777} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#B8B8B8}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#B8B8B8}%ifname%%{F-} %local_ip%

[module/date]
type = custom/script
exec = python3 __RICE_HOME__/.config/polybar/scripts/clock.py
interval = 1
label = %output%
label-foreground = ${colors.foreground}
click-left = python3 __RICE_HOME__/.config/polybar/scripts/calendar-menu.py
click-right = python3 __RICE_HOME__/.config/polybar/scripts/clock.py toggle

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini

[module/powermenu]
type = custom/text
format = "⏻"
format-font = 4
format-foreground = #E0A3A3
format-background = #383030
format-padding = 2
click-left = /usr/bin/python3 __RICE_HOME__/.config/polybar/scripts/power-menu.py

[module/divider]
type = custom/text
format = "│"
format-padding = 1
format-foreground = #505050

[module/music]
type = custom/script
exec = /usr/bin/python3 -u __RICE_HOME__/.config/polybar/scripts/music-panel.py
tail = true
format = <label>
label = %output%

[module/logo]
type = custom/text
format = %{O13}

[module/appicon]
type = custom/text
format = %{O22}

[module/notifications]
type = custom/script
exec = /usr/bin/python3 -u __RICE_HOME__/.config/polybar/scripts/notifications.py
tail = true
label = %output%
click-left = /usr/bin/python3 __RICE_HOME__/.config/polybar/scripts/notifications.py toggle
click-right = /usr/bin/python3 __RICE_HOME__/.config/polybar/scripts/notification-history.py

; Notification format uses plain text.

[module/right-divider]
type = custom/text
format = %{O3}│%{O3}
format-foreground = #505050

[module/internet]
type = custom/script
exec = /usr/bin/python3 -u __RICE_HOME__/.config/polybar/scripts/internet.py
tail = true
format = <label>
format-padding = 1
label = %output%
click-left = /usr/bin/python3 __RICE_HOME__/.config/polybar/scripts/internet-menu.py
click-right = xdg-open https://yandex.ru/internet/

; Happ: left click toggles the VPN; right click opens the Rofi server menu.
[module/happ]
type = custom/script
exec = /usr/bin/python3 __RICE_HOME__/.config/polybar/scripts/happ-vpn.py status
interval = 1
format = <label>
format-padding = 1
label = %output%
click-left = /usr/bin/python3 __RICE_HOME__/.config/polybar/scripts/happ-vpn.py toggle
click-right = /usr/bin/python3 __RICE_HOME__/.config/polybar/scripts/happ-vpn.py open
